<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#121413"><title>Project 90</title><style>
:root{--bg:#121413;--c:#1b1e1c;--l:#2a2f2c;--t:#e9ede9;--m:#8b948d;--g:#4ade80;--b:#60a5fa;--y:#fbbf24;--r:#f87171;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 "Segoe UI",Roboto,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:14px 14px 90px}h1{font-size:22px;margin:0;letter-spacing:.5px}h2{font-size:17px;margin:18px 0 8px}h3{font-size:15px;margin:0 0 8px}
.cd{background:var(--c);border-radius:16px;padding:14px;margin:0 0 12px}.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lb,.sm{font-size:12px;color:var(--m)}.em{color:var(--m);font-size:13px;margin:6px 0}.big{font-size:34px;font-weight:700;line-height:1.1}
input,select,textarea{width:100%;background:#0e100f;color:var(--t);border:1px solid var(--l);border-radius:10px;padding:9px;font:inherit}textarea{min-height:64px}input[type=checkbox]{width:22px;height:22px;accent-color:var(--g);flex:none}
.bt{background:var(--g);color:#06220f;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}.gh{background:var(--l);color:var(--t)}.dg{background:#3a1f1f;color:var(--r)}
.hb{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--l)}.hb:last-child{border:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0d0f0e;border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom,0px)}nav button{flex:1;background:none;border:0;color:var(--m);padding:13px 0;font:inherit;font-size:12px}nav .on{color:var(--g);font-weight:700}
.bar{height:8px;background:var(--l);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}.ch{width:100%;height:90px}.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--l)}.kv:last-child{border:0}
.hm{display:grid;grid-template-rows:repeat(7,20px);grid-auto-flow:column;grid-auto-columns:20px;gap:3px;overflow-x:auto}.hc{border-radius:4px;background:var(--l);border:0;padding:0}.tag{font-size:11px;background:var(--l);border-radius:8px;padding:2px 8px}
.ac{border:1px solid var(--l);border-radius:12px;padding:10px;opacity:.45}.ac.on{opacity:1;border-color:var(--g);animation:pop .5s}@keyframes pop{from{transform:scale(.94)}to{transform:scale(1)}}@media(prefers-reduced-motion:reduce){.ac.on{animation:none}}
#md{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:20px;z-index:9}#md div{background:var(--c);border-radius:16px;padding:18px;max-width:340px}
</style></head><body><main id="app"></main><nav id="nav"></nav><div id="md"></div><script>
const $=s=>document.querySelector(s),SK='project90',S0=new Date(2026,10,22);
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=k=>{const[a,b,c]=k.split('-');return new Date(+a,b-1,+c)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dayN=d=>Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-S0)/864e5)+1;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=n=>'NPR '+Math.round(n||0).toLocaleString('en-IN');
let D={};try{D=JSON.parse(localStorage.getItem(SK))||{}}catch(e){}
const norm=()=>{D.rem=Object.assign({water:true,wake:'07:00',end:'20:00',iv:30,hab_on:true,hab:'21:00',rev_on:true,rev:'18:00',plan_on:true,plan:'21:30'},D.rem||{});D.days=D.days||{};D.meas=D.meas||[];D.wk=D.wk||[];D.proj=D.proj||[];D.rev=D.rev||{};D.wb=D.wb||{};D.prof=D.prof||{h:170,age:28,w:63};D.t=Object.assign({prot:110,water:3,pages:20,med:10,hrs:2,vid:2,out:5},D.t||{})};norm();
const save=()=>{try{localStorage.setItem(SK,JSON.stringify(D))}catch(e){}};
const gd=k=>D.days[k]||{h:[],m:{},j:[],n:{},b:{}};
const day=k=>{const d=D.days[k]||(D.days[k]={});d.h=d.h||[];d.m=d.m||{};d.j=d.j||[];d.n=d.n||{};d.b=d.b||{};return d};
const CN=['Body','Mind','Business'],CC=['var(--g)','var(--b)','var(--y)'],CS=[5,4,3];
const H=()=>{const t=D.t;return[['Workout or active recovery',0],['Follow nutrition plan',0],['Zero smoking',0],['Drink '+t.water+' L of water',0],['7,000–10,000 steps',0],['Read '+t.pages+' pages',1],['Meditate '+t.med+' minutes',1],['Entertainment/social media 30 min or less',1],['Journal or reflect',1],[t.hrs+' hours of strategic business work',2],['Complete daily business priorities',2],['Plan tomorrow',2]]};
const sc=k=>(gd(k).h||[]).filter(Boolean).length;
const hc=(k,c)=>H().reduce((a,h,i)=>a+(h[1]==c&&gd(k).h[i]?1:0),0);
const pct=(ks,c)=>ks.length?ks.reduce((a,k)=>a+(c<0?sc(k):hc(k,c)),0)/(ks.length*(c<0?12:CS[c])):0;
const win=k=>sc(k)>=9;
const keysTo=n=>{const a=[];for(let i=0;i<Math.min(Math.max(n,0),90);i++)a.push(dk(addD(S0,i)));return a};
const sumF=(ks,s,x)=>ks.reduce((a,k)=>a+(+gd(k)[s][x]||0),0);
const avgF=(ks,x)=>{const v=ks.map(k=>gd(k).m[x]).filter(z=>z!=null);return v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):'–'};
function streaks(){let best=0,run=0;for(let i=0;i<90;i++){if(win(dk(addD(S0,i)))){run++;best=Math.max(best,run)}else run=0}let cur=0,i=Math.min(dayN(new Date()),90)-1;if(i<0)return[0,best];if(!win(dk(addD(S0,i))))i--;while(i>=0&&win(dk(addD(S0,i)))){cur++;i--}return[cur,best]}
function wstats(wi){const n=dayN(new Date()),ks=[];for(let i=0;i<7;i++){const k=dk(addD(S0,wi*7+i));if(dayN(pd(k))<=n)ks.push(k)}
const ms=D.meas.filter(m=>m.w!=null&&m.d>=dk(addD(S0,wi*7))&&m.d<=dk(addD(S0,wi*7+6)));
return{ks,all:pct(ks,-1),b:pct(ks,0),m:pct(ks,1),z:pct(ks,2),wo:ks.filter(k=>gd(k).h[0]).length,sm:ks.filter(k=>gd(k).h[2]).length,pg:sumF(ks,'m','read'),hrs:sumF(ks,'b','hrs'),wc:ms.length>1?(ms[ms.length-1].w-ms[0].w).toFixed(1)+' kg':'–',mood:avgF(ks,'mood'),en:avgF(ks,'en'),st:avgF(ks,'st')}}
let tab=0,sel,tk,sx='';
const ring=(p,sz,c,lab)=>{const r=sz/2-6,C=2*Math.PI*r,h=sz/2;return`<svg width="${sz}" height="${sz}"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="var(--l)" stroke-width="7"/><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${c}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C*Math.min(p,1)} ${C}" transform="rotate(-90 ${h} ${h})"/><text x="${h}" y="${h+5}" text-anchor="middle" fill="var(--t)" font-size="${sz>90?20:14}" font-weight="700">${lab??Math.round(p*100)+'%'}</text></svg>`};
const line=(v,u='')=>{v=v.filter(x=>x!=null&&!isNaN(x));if(v.length<2)return'<p class="em">Log at least two entries to see this chart.</p>';const mn=Math.min(...v),mx=Math.max(...v),W=320,Hh=90,rg=mx-mn||1,p=v.map((y,i)=>[i*W/(v.length-1),Hh-8-(y-mn)/rg*(Hh-16)]);return`<svg viewBox="0 0 ${W} ${Hh}" class="ch"><polyline fill="none" stroke="var(--g)" stroke-width="2" points="${p.map(a=>a.join(',')).join(' ')}"/>${p.map(a=>`<circle cx="${a[0]}" cy="${a[1]}" r="2.5" fill="var(--g)"/>`).join('')}</svg><div class="sm">Range ${mn}${u} to ${mx}${u}</div>`};
const ser=(s,x)=>keysTo(Math.min(dayN(new Date()),90)).map(k=>gd(k)[s][x]);
const F=(s,x,lab,o={})=>`<div><div class="lb">${lab}</div><input type="${o.t||'number'}" ${o.t?'':'step="any" inputmode="decimal"'} ${o.a||''} value="${esc(gd(sel)[s][x]??'')}" onchange="sv('${s}','${x}',this.value,${!o.t})"></div>`;
const sv=(s,x,v,num)=>{day(sel)[s][x]=v===''?null:(num?+v:v);save()};
const tg=(k,i)=>{const d=day(k);d.h[i]=!d.h[i];save();r()};
const mv=n=>{sel=dk(addD(pd(sel),n));r()};
const go=i=>{tab=i;r();scrollTo(0,0)};
const ask=(msg,fn)=>{window._f=fn;const m=$('#md');m.style.display='flex';m.innerHTML=`<div><p>${msg}</p><div class="row"><button class="bt dg" onclick="window._f();$('#md').style.display='none'">Yes, continue</button><button class="bt gh" onclick="$('#md').style.display='none'">Cancel</button></div></div>`};
const dnav=()=>{const n=dayN(pd(sel));return`<div class="row sp cd"><button class="bt gh" onclick="mv(-1)">‹</button><div style="text-align:center"><b>${pd(sel).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</b><div class="sm">${n>=1&&n<=90?'Day '+n+' of 90':'Outside the challenge dates'}${sel==tk?' / today':''}</div></div><button class="bt gh" onclick="mv(1)">›</button></div>`};
const hl=k=>{let o='';CN.forEach((c,ci)=>{o+=`<div class="lb" style="margin-top:8px;color:${CC[ci]}">${c} ${hc(k,ci)}/${CS[ci]}</div>`;H().forEach((h,i)=>{if(h[1]==ci)o+=`<label class="hb"><input type="checkbox" ${gd(k).h[i]?'checked':''} onchange="tg('${k}',${i})"><span>${h[0]}</span></label>`})});return o};
const Q=['Show up today. Small and honest beats perfect and absent.','A missed day is data. The next day is the answer.','Discipline is a decision you repeat.','Build the system so the site runs without you.','Strong body, clear mind, healthy cash flow.','Do the next right thing, then the next.','Rest is part of the plan. Pain is a signal to stop.','Review honestly tonight, plan clearly for tomorrow.','Each cigarette-free day is a vote for who you are becoming.'];
function home(){const n=dayN(new Date()),cn=Math.min(Math.max(n,1),90),ks=keysTo(n),k=dk(addD(S0,cn-1)),ov=pct(ks,-1),[cur]=streaks(),ws=wstats(Math.floor((cn-1)/7));
const hd=n<1?`Starts in ${1-n} day${n<0?'s':''}`:n>90?'Challenge complete':`DAY ${n} / 90`;
return`<div class="row sp"><div><h1>PROJECT 90</h1><div class="sm">90 Days. One Commitment.</div></div><div style="text-align:right"><b style="color:var(--g)">${hd}</b><div class="sm">${Math.max(90-n,0)} days to Feb 19, 2027</div></div></div>
<div class="cd" style="margin-top:12px"><div class="row"><div>${ring(ov,96,'var(--g)')}</div><div><div class="lb">Overall completion so far</div><div class="bar" style="width:150px;margin:6px 0"><i style="width:${Math.min(cn/90*100,100)}%"></i></div><div class="sm">${Math.min(Math.max(n-1,0),90)} days completed, ${Math.max(90-n,0)} remaining</div><div class="sm">Streak ${cur} days, week ${Math.round(ws.all*100)}%</div></div></div></div>
<div class="g3">${CN.map((c,i)=>`<div class="cd" style="text-align:center;padding:10px" onclick="go(${i==0?2:i==1?3:4})">${ring(pct(ks,i),70,CC[i])}<div class="sm">${c}</div><div class="sm">today ${hc(k,i)}/${CS[i]}</div></div>`).join('')}</div>
<div class="cd"><h3>${k==tk?"Today’s checklist":'Checklist for '+k} (${sc(k)}/12)</h3>${hl(k)}</div>
<div class="cd"><div class="sm">Daily message</div><p style="margin:4px 0 0">${Q[(cn-1)%Q.length]}</p></div>
<div class="g2">${['Daily','Body','Mind','Business'].map((x,i)=>`<button class="bt gh" onclick="go(${i+1})">${x}</button>`).join('')}</div>`}
function heat(){const n=dayN(new Date());let o='<div class="hm">';for(let i=0;i<90;i++){const k=dk(addD(S0,i)),s=sc(k),fut=i+1>n;o+=`<button class="hc" title="${k}: ${s}/12" style="${fut?'opacity:.35':s?`background:rgba(74,222,128,${.2+s/12*.8})`:''}${k==sel?';outline:2px solid var(--t)':''}" onclick="sel='${k}';r()"></button>`}return o+'</div>'}
function daily(){const k=sel,[cur,best]=streaks(),miss=H().filter((h,i)=>!gd(k).h[i]).map(h=>h[0]);
return dnav()+`<div class="cd"><div class="row sp"><h3>Daily score</h3><span class="big" style="color:var(--g)">${sc(k)}<span class="sm">/12</span></span></div>${hl(k)}</div>
<div class="cd"><h3>Streak</h3><p class="em" style="margin:0">Current ${cur} days, best ${best}. A winning day scores 9 or more out of 12. Missed days never reset your history.</p></div>
${pd(k)<=new Date()?`<div class="cd"><h3>Missed habits</h3>${miss.length?'<ul style="margin:0;padding-left:18px">'+miss.map(m=>`<li>${m}</li>`).join('')+'</ul>':'<p class="em">Nothing missed on this day.</p>'}</div>`:''}
<div class="cd"><h3>90-day heatmap</h3>${heat()}<div class="sm" style="margin-top:6px">Tap a square to view or edit that day. Brighter means a higher score.</div></div>`}
const PLAN=['Rest','Chest and triceps','Back and biceps','Legs and core','Shoulders and arms','Full body','Active recovery'];
function body(){const P=D.prof,ms=D.meas,last=x=>{const a=ms.filter(m=>m[x]!=null);return a.length?a[a.length-1][x]:null},n=D.t.prot,pr=+gd(sel).n.prot||0;
const ex={};D.wk.filter(w=>!w.p&&w.kg).forEach(w=>{(ex[w.ex]=ex[w.ex]||[]).push(w)});const names=Object.keys(ex);if(!sx||!ex[sx])sx=names[0]||'';
const allEx=[...new Set([...'Bench press,Incline dumbbell press,Triceps pushdown,Pull-up,Barbell row,Biceps curl,Squat,Leg press,Plank,Overhead press,Lateral raise,Deadlift'.split(','),...D.wk.map(w=>w.ex)])];
const wcount=keysTo(Math.min(dayN(new Date()),90)).filter(k=>gd(k).h[0]).length;
return dnav()+`<div class="cd"><h3>Profile</h3><div class="g3"><div><div class="lb">Height cm</div><input type="number" value="${P.h}" onchange="D.prof.h=+this.value;save()"></div><div><div class="lb">Age</div><input type="number" value="${P.age}" onchange="D.prof.age=+this.value;save()"></div><div><div class="lb">Start kg</div><input type="number" step="any" value="${P.w}" onchange="D.prof.w=+this.value;save();r()"></div></div><p class="em">Male. Latest weight ${last('w')??'–'} kg, start ${P.w} kg.</p></div>
<div class="cd"><h3>Log measurements</h3><div class="g2"><div><div class="lb">Date</div><input type="date" id="md0" value="${sel}"></div><div><div class="lb">Weight kg</div><input id="mw" type="number" step="any"></div><div><div class="lb">Chest cm</div><input id="mc" type="number" step="any"></div><div><div class="lb">Waist cm</div><input id="mwa" type="number" step="any"></div><div><div class="lb">Biceps cm</div><input id="mb" type="number" step="any"></div><div><div class="lb">Shoulders cm</div><input id="ms" type="number" step="any"></div></div><button class="bt" style="margin-top:10px" onclick="addM()">Save measurements</button>
<h3 style="margin-top:14px">Weight</h3>${line([P.w,...ms.map(m=>m.w)],' kg')}<h3>Waist</h3>${line(ms.map(m=>m.wa),' cm')}<h3>Biceps</h3>${line(ms.map(m=>m.bi),' cm')}<p class="em">Body photos are not included in this version.</p></div>
<div class="cd"><h3>Workout: ${PLAN[pd(sel).getDay()]}</h3><div class="lb">Exercise</div><input id="we" list="exl" placeholder="Type or pick an exercise"><datalist id="exl">${allEx.map(e=>`<option value="${esc(e)}">`).join('')}</datalist><div class="g3" style="margin-top:8px"><div><div class="lb">Sets</div><input id="ws" type="number"></div><div><div class="lb">Reps</div><input id="wr" type="number"></div><div><div class="lb">Kg</div><input id="wk" type="number" step="any"></div></div>
<label class="hb"><input type="checkbox" id="wp"><span>Painful or skipped. Stop and rest; never train through pain.</span></label><button class="bt" onclick="addW()">Add exercise</button>
<h3 style="margin-top:14px">Personal records</h3>${names.length?names.map(e=>{const a=ex[e],m=Math.max(...a.map(w=>w.kg));return`<div class="kv"><span>${esc(e)}</span><b>${a[0].kg} to ${m} kg (PR ${m})</b></div>`}).join(''):'<p class="em">Log weighted sets to track records.</p>'}
${names.length?`<div class="lb" style="margin-top:10px">Strength trend</div><select onchange="sx=this.value;r()">${names.map(e=>`<option ${e==sx?'selected':''}>${esc(e)}</option>`).join('')}</select>${line((ex[sx]||[]).map(w=>w.kg),' kg')}`:''}
<h3 style="margin-top:14px">History</h3>${D.wk.length?D.wk.map((w,i)=>[w,i]).reverse().slice(0,15).map(([w,i])=>`<div class="kv"><span>${w.d} ${esc(w.ex)}${w.p?' <span class="tag" style="color:var(--r)">pain/skipped</span>':''}</span><span>${w.s}x${w.r} @ ${w.kg} kg <button class="tag" style="border:0;color:var(--r)" onclick="ask('Delete this entry?',()=>{D.wk.splice(${i},1);save();r()})">Delete</button></span></div>`).join(''):'<p class="em">No workouts logged yet.</p>'}<p class="em">Workout days ticked so far: ${wcount}.</p></div>
<div class="cd"><h3>Nutrition</h3><div class="g2">${F('n','prot','Protein g (target '+n+')')}${F('n','cal','Calories (optional)')}${F('n','water','Water litres')}${F('n','meals','Meals',{t:'text'})}</div><div class="bar" style="margin:10px 0"><i style="width:${Math.min(pr/n*100,100)}%"></i></div>${F('n','nn','Food notes',{t:'text'})}</div>`}
const addM=()=>{const g=i=>{const v=$('#'+i).value;return v===''?null:+v},e={d:$('#md0').value||tk,w:g('mw'),c:g('mc'),wa:g('mwa'),bi:g('mb'),sh:g('ms')};if(Object.values(e).every(v=>v==null||v==e.d))return;const o=D.meas.find(x=>x.d==e.d);if(o)Object.keys(e).forEach(x=>{if(e[x]!=null)o[x]=e[x]});else D.meas.push(e);D.meas.sort((a,b)=>a.d<b.d?-1:1);save();r()};
const addW=()=>{const x=$('#we').value.trim();if(!x)return;D.wk.push({d:sel,ex:x,s:+$('#ws').value||0,r:+$('#wr').value||0,kg:+$('#wk').value||0,p:$('#wp').checked});save();r()};
function mind(){const n=Math.min(dayN(new Date()),90),ks=keysTo(n),sf=ks.filter(k=>gd(k).h[2]).length,J=['What went well today?','What did I struggle with?','What did I learn?','What will I improve tomorrow?'];
return dnav()+`<div class="cd"><div class="row sp"><h3>Smoke-free days</h3><span class="big" style="color:var(--g)">${sf}<span class="sm">/90</span></span></div><div class="bar"><i style="width:${sf/90*100}%"></i></div><p class="em">Counted from days where you ticked “Zero smoking”.</p></div>
<div class="cd"><h3>Today’s mind log</h3><div class="g2">${F('m','read','Pages read')}${F('m','med','Meditation minutes')}${F('m','sm','Social/entertainment min')}${F('m','sleep','Sleep hours')}${F('m','mood','Mood (1–10)',{a:'min="1" max="10"'})}${F('m','en','Energy (1–10)',{a:'min="1" max="10"'})}${F('m','st','Stress (1–10)',{a:'min="1" max="10"'})}</div><p class="em">A personal log for spotting patterns, not a medical tool.</p></div>
<div class="cd"><h3>Journal</h3>${J.map((q,i)=>`<div class="lb" style="margin-top:8px">${q}</div><textarea onchange="day(sel).j[${i}]=this.value;save()">${esc(gd(sel).j[i]||'')}</textarea>`).join('')}</div>
<div class="cd"><h3>Mood</h3>${line(ser('m','mood'))}<h3>Energy</h3>${line(ser('m','en'))}<h3>Stress</h3>${line(ser('m','st'))}<h3>Sleep</h3>${line(ser('m','sleep'),' h')}</div>`}
const WB=[['leads','New leads'],['meet','Client meetings'],['prop','Proposals submitted'],['cont','Contracts signed'],['post','Social posts'],['vid','Videos published'],['conn','New connections'],['out','High-value clients contacted']];
function biz(){const wi=Math.floor((Math.min(Math.max(dayN(pd(sel)),1),90)-1)/7),w=D.wb[wi]||{},t=D.t;
return dnav()+`<div class="cd"><h3>UEC Builders daily log</h3><div class="g2">${F('b','hrs','Strategic hours')}${F('b','fu','Client follow-ups')}${F('b','leads','New leads')}${F('b','visits','Site visits')}${F('b','deleg','Tasks delegated')}${F('b','pay','Outstanding payments (NPR)')}</div>${F('b','dec','Important decisions',{t:'text'})}${F('b','acc','Accomplishments',{t:'text'})}</div>
<div class="cd"><h3>Week ${wi+1} growth</h3><div class="g2">${WB.map(([x,l])=>`<div><div class="lb">${l}${x=='vid'?' (target '+t.vid+')':x=='out'?' (target '+t.out+')':''}</div><input type="number" value="${w[x]??''}" onchange="D.wb[${wi}]=D.wb[${wi}]||{};D.wb[${wi}]['${x}']=+this.value;save()"></div>`).join('')}</div>

${RQ.map((q,i)=>`<div class="lb" style="margin-top:8px">${i+1}. ${q}</div><textarea onchange="D.rev[${wi}]=D.rev[${wi}]||[];D.rev[${wi}][${i}]=this.value;save()">${esc(rv[i]||'')}</textarea>`).join('')}</div>
<h2>Achievements</h2><div class="g2">${A.map(a=>`<div class="ac ${a[2]?'on':''}"><b>${a[2]?'★ ':''}${a[0]}</b><div class="sm">${a[1]}</div></div>`).join('')}</div>

<div class="lb" style="margin-top:8px">Mind</div>${R('Smoke-free days',cnt(2))}${R('Pages read',sm('m','read'))}${R('Meditation days / minutes',cnt(6)+' / '+sm('m','med'))}${R('Mood / energy average',avgF(ks,'mood')+' / '+avgF(ks,'en'))}${R('Current / best streak',cur+' / '+best)}${hl2.length?`<div class="sm" style="margin-top:6px">Recent “went well”: ${hl2.map(esc).join(' | ')}</div>`:''}

try{const p=await L.requestPermissions();if(p.display!='granted'){note('Notifications are blocked. Allow them for Project 90 in Android settings, then try again.');return}
